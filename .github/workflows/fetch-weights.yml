name: Fetch connectome weights

on:
  push:
    branches: ['arena/4239e878-iso']
    paths:
      - '.github/workflows/fetch-weights.yml'
      - 'solver/fetch_weights.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download weights and filter the induced subgraph
        run: |
          python -m pip install --quiet pandas pyarrow
          python -u solver/fetch_weights.py
          ls -lh raw/weights_* || true
      - name: Commit results to the session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f raw/weights_schema.txt raw/weights_subset.csv.gz raw/weights_pair.csv.gz
          git commit -m 'Add MaleCNS synaptic weights for the task subgraph'
          git pull --rebase origin arena/4239e878-iso
          git push origin HEAD:arena/4239e878-iso
