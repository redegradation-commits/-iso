name: Fetch connectome task files

on:
  push:
    branches: ['arena/4239e878-iso']
    paths:
      - '.github/workflows/fetch-connectome.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download task attachments
        run: |
          mkdir -p raw
          curl -fL --retry 4 --retry-delay 2 -o raw/message.bin 'https://game.ctfcup.online/attachments/88c96ad0b1b7ccd6/message.bin'
          curl -fL --retry 4 --retry-delay 2 -o raw/adjacency.csv.gz 'https://game.ctfcup.online/attachments/5a4830f101676a4e/adjacency.csv.gz'
          ls -l raw
          file raw/* || true
          sha256sum raw/*
          gzip -l raw/adjacency.csv.gz || true
      - name: Commit downloaded files to the session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f raw
          git commit -m 'Add downloaded connectome attachments'
          git pull --rebase origin arena/4239e878-iso
          git push origin HEAD:arena/4239e878-iso
