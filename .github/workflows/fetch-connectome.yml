name: Fetch connectome task files

on:
  push:
    branches: ['arena/4239e878-iso']
    paths:
      - '.github/workflows/fetch-connectome.yml'
      - 'solver/fetch_annotations.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download MaleCNS annotations for graph nodes
        run: |
          python -m pip install --quiet pandas pyarrow
          python -u solver/fetch_annotations.py
          ls -l raw
          head -5 raw/annotations_subset.csv || true
      - name: Commit results to the session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f raw/annotations_subset.csv raw/nt_subset.csv
          git commit -m 'Add MaleCNS annotations for connectome graph nodes'
          git pull --rebase origin arena/4239e878-iso
          git push origin HEAD:arena/4239e878-iso
